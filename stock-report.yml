# ============================================================================
# 根目录兼容副本（GitHub Actions 不会执行）。
# 活跃手动工作流位于 .github/workflows/stock-report.yml；每日全市场定时推送
# 单独位于 .github/workflows/market-brief.yml。请勿用本文件覆盖活跃工作流，
# 否则会丢失手动预览安全默认值与定时简报配置。
#
# 本副本只保留单标的研报的 workflow_dispatch 配置，默认 dry_run=true，
# 需要真实发送个股研报时必须手动明确切换为 false。
# ============================================================================
name: Manual Run - Stock Report (HK/A-share/US)

on:
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码（港股 09988 / A股 600519 / 000001.SZ / 美股 NVDA）'
        required: true
        default: '09988'
        type: string
      template:
        description: '研报框架（默认 equity=机构级九章投研；经典模板同样附带最新功能）'
        required: true
        default: 'equity'
        type: choice
        options:
          - equity
          - analysis
          - brief
          - scan
          - picker
          - fusion
          - plan
          - earnings
          - portfolio
          - review
          - regime
          - sentiment
          - feedscan
          - newsnow
          - initiate
          - earnings_preview
          - earnings_update
          - model_update
          - morning_note
          - catalysts
          - thesis
          - sector
          - ideas
      mode:
        description: 'equity 栏目模式：full=九章深度 / earnings=财报深度'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - earnings
      channel:
        description: '推送通道（console=只打印到日志，不发微信）'
        required: true
        default: 'pushplus'
        type: choice
        options:
          - pushplus
          - wecom
          - serverchan
          - console
          - all
      ai_provider:
        description: 'AI 提供方（auto=有 DEEPSEEK_API_KEY 用 deepseek，否则 rule）'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - deepseek
          - openai
          - rule
      theme:
        description: '视觉主题'
        required: true
        default: 'dos'
        type: choice
        options:
          - dos
          - guizang
          - monitor
          - noc
          - game
          - klein
          - pixel
          - default
      hours:
        description: '量价舆情 / 十七平台扫描窗口（小时）'
        required: true
        default: '48'
        type: choice
        options:
          - '24'
          - '48'
          - '72'
          - '156'
      risk:
        description: '风险偏好（portfolio 模板生效）'
        required: true
        default: 'mid'
        type: choice
        options:
          - low
          - mid
          - high
      industry:
        description: 'equity 行业附录 slug（留空=自动猜测）'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'true=只预览（默认）；false=真实推送单标的研报'
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      ai_compress:
        description: 'AI 分节压缩：正文每部分分别调用 AI 简化+压缩（失败回退原文）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: stock-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Generate & Push Stock Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      PYTHONUNBUFFERED: '1'

    steps:
      # actions/checkout@v4（pin 到 commit SHA，防 tag 解析抖动）
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # actions/setup-python@v5 —— 注意：不要加 cache: 'pip'（本仓库无依赖清单）
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Show run config (不打印任何 Secret)
        run: |
          echo "code=${{ inputs.code }} template=${{ inputs.template }} mode=${{ inputs.mode }}"
          echo "channel=${{ inputs.channel }} ai_provider=${{ inputs.ai_provider }}"
          echo "theme=${{ inputs.theme }} hours=${{ inputs.hours }} risk=${{ inputs.risk }}"
          echo "industry=${{ inputs.industry }} dry_run=${{ inputs.dry_run }} ai_compress=${{ inputs.ai_compress }}"
          python -V

      - name: Restore push state (新鲜度看板跨运行对比)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: |
            push-state-

      - name: Offline selftest (离线自检 · 全程屏蔽 AI Key，结果与 Secret 配置无关)
        run: python stock_report.py --selftest

      - name: Check secrets (只检查配置，不发送)
        continue-on-error: true
        run: |
          python stock_report.py --check-only \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}"

      - name: Dry run (只生成内容，不推送)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          python stock_report.py "${{ inputs.code }}" \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}" \
            --template "${{ inputs.template }}" \
            --mode "${{ inputs.mode }}" \
            --industry "${{ inputs.industry }}" \
            --risk "${{ inputs.risk }}" \
            --theme "${{ inputs.theme }}" \
            --hours "${{ inputs.hours }}" \
            --ai-compress "${{ inputs.ai_compress }}"

      - name: Real push (真实推送到微信)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          python stock_report.py "${{ inputs.code }}" \
            --channel "${{ inputs.channel }}" \
            --ai-provider "${{ inputs.ai_provider }}" \
            --template "${{ inputs.template }}" \
            --mode "${{ inputs.mode }}" \
            --industry "${{ inputs.industry }}" \
            --risk "${{ inputs.risk }}" \
            --theme "${{ inputs.theme }}" \
            --hours "${{ inputs.hours }}" \
            --push

      - name: Save push state (供下次新鲜度对比)
        if: ${{ success() && hashFiles('output/push_state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
